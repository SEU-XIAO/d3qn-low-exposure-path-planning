# 用法:
#   python -m train.train_local_pool_ppo --config experiments/local_v2.toml
#   python -m visualize.failure_case_report --config experiments/local_v2.toml --config-section failure_case_report_smoke
#   python -m visualize.hierarchical_waypoint_eval --config experiments/local_v2.toml

[fragments.data]
pool = "artifacts/window_pool_10_subtask_30k.npz"
val_ratio = 0.2

[fragments.train_eval]
curriculum = true
eval_episodes = 50
eval_full_every = 10

[fragments.optim]
lr = 1e-4
entropy = 0.03
epochs = 6
backbone = "res_small"

[fragments.obs_v2]
obs_view_size = 10
obs_line_guide = false
obs_visited = true
obs_remaining = true
obs_stagnation = true
obs_stagnation_cap = 8
obs_prev_move = true
obs_visit_decay = 0.92
planner_guide = true
planner_guide_sigma = 1.4
planner_w_len = 1.0
planner_w_vis = 2.5
planner_w_slope = 0.8
planner_w_turn = 0.15

[fragments.obs_eval]
obs_line_guide = false
obs_visited = true
obs_remaining = true
obs_stagnation = true
obs_stagnation_cap = 8
obs_prev_move = true
obs_visit_decay = 0.92
planner_guide = true
planner_guide_sigma = 1.4
planner_w_len = 1.0
planner_w_vis = 2.5
planner_w_slope = 0.8
planner_w_turn = 0.15

[fragments.bc]
expert_mode = "planner"
bc_mode = "all"
bc_weight = 0.15
bc_pretrain_steps = 2000
bc_pretrain_batch_size = 256
bc_near_goal_radius = 4.0

[fragments.near]
near_goal_retreat_penalty = 0.3
near_goal_osc_penalty = 0.15

[fragments.eval_fb]
eval_fallback = true
eval_fallback_goal_radius = 3.0
eval_fallback_stagnation = 4
eval_fallback_remaining_steps = 8
eval_fallback_max_uses = 1

[train_local_pool_ppo]
inherits = [
  "fragments.data",
  "fragments.train_eval",
  "fragments.optim",
  "fragments.obs_v2",
  "fragments.bc",
  "fragments.near",
  "fragments.eval_fb",
]
save = "checkpoints_local_v2"
steps = 500000
envs = 8

[failure_case_report]
inherits = [
  "fragments.data",
  "fragments.obs_v2",
]
model = "checkpoints_local_v2/policy_best.pt"
output_dir = "analysis/local_v2_eval10"
max_steps = 70
limit = 0
save_fail_maps = 40
progress_every = 100

[failure_case_report_smoke]
inherits = [
  "fragments.data",
  "fragments.obs_v2",
]
model = "checkpoints_local_v2/policy_best.pt"
output_dir = "analysis/local_v2_eval10_smoke"
max_steps = 70
limit = 200
save_fail_maps = 20
progress_every = 20

[hierarchical_waypoint_eval]
inherits = [
  "fragments.obs_eval",
]
model = "checkpoints_local_v2/policy_best.pt"
output_dir = "analysis/local_v2_eval50"
episodes = 100
max_steps = 220
policy_view_size = 10
executor = "rl"
subgoal_max_hop = 4
w_len = 1.0
w_vis = 2.5
w_slope = 0.8
w_turn = 0.15
wp_spacing = 7
wp_min_segment = 3
wp_reach_radius = 1.5
replan_stagnation = 10
replan_collisions = 6
replan_max = 4
fallback_goal_radius = 3.0
fallback_stagnation = 4
fallback_remaining_steps = 8
fallback_max_uses = 1
fb_w_len = 1.0
fb_w_vis = 2.0
fb_w_slope = 0.6
fb_w_turn = 0.1
